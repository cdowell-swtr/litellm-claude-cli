name: ci
on:
  push:
    # Every branch, not just master: v0.3.1 was committed to a stray branch
    # (since deleted), so a master-only filter ran nothing and a release reached
    # its tag with a failing `ruff format --check`.
    branches: ['**']
  pull_request:

# A PR branch matches both triggers; keep the newest run per ref and cancel the rest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q

  conventions:
    # Backstop for the adopted patterns conventions (gitleaks + docs-layout).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/
      - name: gitleaks (full-repo secret scan)
        run: gitleaks dir . --no-banner --redact
      - name: docs-layout validator
        run: bash hooks/docs-layout-check.sh
